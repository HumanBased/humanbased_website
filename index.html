    <style>
      body {
        font-family: 'Inter', 'Inter Fallback', sans-serif;
        background-color: #050509;
        color: #ffffff;
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .amber-gradient {
        background: linear-gradient(135deg, theme('colors.amber.500') 0%, theme('colors.amber.600') 100%);
      }
      .bg-deep-navy {
        background: radial-gradient(circle at top right, #0a0a1a 0%, #050509 100%);
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 8s ease-in-out infinite;
      }
      @keyframes gold-shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .gold-shimmer {
        background-image: linear-gradient(90deg, #c8960c 0%, #f0b90b 25%, #ffe566 50%, #f0b90b 75%, #c8960c 100%);
        background-size: 200% 100%;
        animation: gold-shimmer 3s linear infinite;
      }
      @keyframes silverShimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .silver-shimmer {
        background-image: linear-gradient(90deg, #8a8a8a 0%, #ffffff 30%, #c0c0c0 50%, #ffffff 70%, #8a8a8a 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: silverShimmer 3s linear infinite;
      }
      .light-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        opacity: 0.15;
      }

      /* Visual Card Shared Styles */
      .visual-card-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.75; /* Brighter default */
        transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.7s ease, filter 0.7s ease;
        filter: saturate(0.8) brightness(0.9);
        transform: scale(1.0);
      }
      .group:hover .visual-card-img,
      .hover-trigger:hover .visual-card-img {
        opacity: 1;
        transform: scale(1.05);
        filter: saturate(1.1) brightness(1.1);
      }
      
      .visual-overlay-transition {
        transition: opacity 0.7s ease;
        opacity: 0.9;
      }
      .group:hover .visual-overlay-transition,
      .hover-trigger:hover .visual-overlay-transition {
        opacity: 0.5;
      }
      /* Visible keyboard focus on every interactive element. */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid #ffc864;
        outline-offset: 3px;
      }

      /* Honour the OS "reduce motion" setting: starfield, aurora, floating and
         shimmer animations stop, and smooth scrolling is turned off. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
